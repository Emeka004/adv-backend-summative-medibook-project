<!doctype html>
<html lang="{{locale}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <style>
    body { max-width: 760px; margin: 2rem auto; padding: 0 1rem; font-family: Arial, sans-serif; }
    .question { margin: 1.25rem 0; }
    label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
    textarea { box-sizing: border-box; width: 100%; min-height: 120px; padding: 0.75rem; }
    button { padding: 0.65rem 1rem; }
  </style>
</head>
<body>
  <header>
    <h1>{{title}}</h1>
    <p>{{instructions}}</p>
    <time>{{date}}</time>
  </header>
  <form>
{{questions}}
    <button type="submit">{{submit}}</button>
  </form>
</body>
</html>
