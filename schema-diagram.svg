<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1380" viewBox="0 0 1800 1380">
  <rect width="1800" height="1320" fill="#ffffff"/>
  <style>
    .title { font: bold 34px Arial, sans-serif; fill: #172033; }
    .subtitle { font: 18px Arial, sans-serif; fill: #46566b; }
    .entity { fill: #f7f9fc; stroke: #31557a; stroke-width: 2; }
    .entity-title { fill: #31557a; }
    .entity-name { font: bold 23px Arial, sans-serif; fill: #ffffff; }
    .field { font: 18px monospace; fill: #172033; }
    .key { font: bold 18px monospace; fill: #9a3412; }
    .relation { stroke: #31557a; stroke-width: 3; fill: none; }
    .relation-label { font: bold 18px Arial, sans-serif; fill: #31557a; }
    .constraint-title { font: bold 19px Arial, sans-serif; fill: #172033; }
    .constraint { font: 16px monospace; fill: #172033; }
  </style>

  <text x="900" y="52" text-anchor="middle" class="title">MediBook - Normalized Database Schema (3NF)</text>
  <text x="900" y="83" text-anchor="middle" class="subtitle">Exactly three entities; primary keys (PK), foreign keys (FK), MySQL types, and business constraints shown.</text>

  <path class="relation" d="M660 325 C715 325 750 390 810 390"/>
  <text class="relation-label" x="696" y="303">1</text>
  <text class="relation-label" x="770" y="375">N</text>
  <text class="relation-label" x="716" y="354">patient books</text>

  <path class="relation" d="M660 825 C715 825 750 800 810 800"/>
  <text class="relation-label" x="696" y="805">1</text>
  <text class="relation-label" x="770" y="785">N</text>
  <text class="relation-label" x="706" y="850">doctor sees</text>

  <rect class="entity" x="60" y="160" width="600" height="400" rx="8"/>
  <rect class="entity-title" x="60" y="160" width="600" height="58" rx="8"/>
  <text class="entity-name" x="360" y="198" text-anchor="middle">patients</text>
  <text class="key" x="88" y="252">PK  id             BIGINT UNSIGNED NOT NULL AUTO_INCREMENT</text>
  <text class="field" x="88" y="296">    name           VARCHAR(120) NOT NULL</text>
  <text class="field" x="88" y="340">    email          VARCHAR(255) NOT NULL UNIQUE</text>
  <text class="field" x="88" y="384">    phone          VARCHAR(30) NOT NULL UNIQUE</text>
  <text class="field" x="88" y="428">    created_at     DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP</text>
  <text class="field" x="88" y="472">    updated_at     DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP</text>
  <text class="field" x="88" y="516">                   ON UPDATE CURRENT_TIMESTAMP</text>

  <rect class="entity" x="60" y="620" width="600" height="460" rx="8"/>
  <rect class="entity-title" x="60" y="620" width="600" height="58" rx="8"/>
  <text class="entity-name" x="360" y="658" text-anchor="middle">doctors</text>
  <text class="key" x="88" y="712">PK  id                BIGINT UNSIGNED NOT NULL AUTO_INCREMENT</text>
  <text class="field" x="88" y="756">    name              VARCHAR(120) NOT NULL</text>
  <text class="field" x="88" y="800">    specialty         VARCHAR(100) NOT NULL</text>
  <text class="field" x="88" y="844">    consultation_fee  DECIMAL(10,2) NOT NULL</text>
  <text class="field" x="88" y="888">    room              VARCHAR(20) NOT NULL</text>
  <text class="field" x="88" y="932">    created_at        DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP</text>
  <text class="field" x="88" y="976">    updated_at        DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP</text>
  <text class="field" x="88" y="1020">                      ON UPDATE CURRENT_TIMESTAMP</text>
  <text class="field" x="88" y="1064">    CHECK (consultation_fee &gt;= 0)</text>

  <rect class="entity" x="810" y="160" width="930" height="900" rx="8"/>
  <rect class="entity-title" x="810" y="160" width="930" height="58" rx="8"/>
  <text class="entity-name" x="1275" y="198" text-anchor="middle">appointments</text>
  <text class="key" x="842" y="252">PK  id                    BIGINT UNSIGNED NOT NULL AUTO_INCREMENT</text>
  <text class="key" x="842" y="296">FK  patient_id            BIGINT UNSIGNED NOT NULL</text>
  <text class="key" x="842" y="340">FK  doctor_id             BIGINT UNSIGNED NOT NULL</text>
  <text class="field" x="842" y="384">    appointment_datetime  DATETIME NOT NULL</text>
  <text class="field" x="842" y="428">    amount_paid           DECIMAL(10,2) NOT NULL</text>
  <text class="field" x="842" y="472">    status                ENUM('booked','cancelled') NOT NULL DEFAULT 'booked'</text>
  <text class="field" x="842" y="516">    booked_at             DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP</text>
  <text class="field" x="842" y="560">    cancelled_at          DATETIME NULL</text>
  <text class="field" x="842" y="604">    refund_amount         DECIMAL(10,2) NULL</text>
  <text class="field" x="842" y="648">    refund_percentage     TINYINT UNSIGNED NULL</text>
  <text class="field" x="842" y="692">GEN active_slot_key       CHAR(1) NULL GENERATED ALWAYS STORED</text>
  <text class="field" x="842" y="714">                          booked='Y', cancelled=NULL</text>
  <text class="field" x="842" y="758">    created_at            DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP</text>
  <text class="field" x="842" y="802">    updated_at            DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP</text>
  <text class="field" x="842" y="846">                          ON UPDATE CURRENT_TIMESTAMP</text>
  <text class="key" x="842" y="904">uq_active_doctor_slot: UNIQUE (doctor_id, appointment_datetime, active_slot_key)</text>
  <text class="field" x="842" y="948">fk_appointments_patient: patient_id REFERENCES patients(id)</text>
  <text class="field" x="842" y="992">fk_appointments_doctor: doctor_id REFERENCES doctors(id)</text>
  <text class="field" x="842" y="1036">chk_appointments_slot: SECOND=0, MINUTE IN (0,30), HOUR BETWEEN 9 AND 16.</text>
  <text class="field" x="842" y="1058">Appointments retain cancellation and refund history.</text>

  <rect x="60" y="1100" width="1680" height="240" rx="8" fill="#eef5ff" stroke="#31557a" stroke-width="2"/>
  <text class="constraint-title" x="88" y="1138">Business rules and constraint semantics</text>
  <text class="constraint" x="88" y="1172">• A doctor can have only one active booking per exact date/time: UNIQUE(doctor_id, appointment_datetime, active_slot_key).</text>
  <text class="constraint" x="88" y="1204">• Cancelled rows produce NULL active_slot_key; MySQL permits multiple NULLs in a UNIQUE index, so history remains and the slot reopens.</text>
  <text class="constraint" x="88" y="1236">• CHECK (consultation_fee &gt;= 0); CHECK (amount_paid &gt;= 0); CHECK (refund_amount IS NULL OR refund_amount &gt;= 0).</text>
  <text class="constraint" x="88" y="1268">• CHECK (refund_percentage IS NULL OR refund_percentage IN (0,50,100)); appointment slot CHECK: SECOND=0, MINUTE IN (0,30), HOUR 9-16.</text>
  <text class="constraint" x="88" y="1300">• Patient email and phone are UNIQUE; required fields are NOT NULL. Future-only and max 12 appointments/doctor/day require transactional enforcement.</text>
</svg>
